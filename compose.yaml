services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: eventrail
      POSTGRES_USER: eventrail
      POSTGRES_PASSWORD: eventrail-local
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventrail -d eventrail"]
      interval: 3s
      timeout: 3s
      retries: 20

  broker:
    image: apache/kafka:4.1.2
    hostname: broker
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:29093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT://:19092,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    volumes:
      - kafka_data:/tmp/kraft-combined-logs

  topics:
    image: apache/kafka:4.1.2
    depends_on:
      - broker
    entrypoint: ["/bin/bash", "-ec"]
    command: >-
      until /opt/kafka/bin/kafka-topics.sh --bootstrap-server broker:19092 --list >/dev/null 2>&1; do sleep 2; done;
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server broker:19092 --create --if-not-exists --topic eventrail.events.v1 --partitions 6 --replication-factor 1;
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server broker:19092 --create --if-not-exists --topic eventrail.dead_letters.v1 --partitions 3 --replication-factor 1

  migrate:
    build: .
    command: ["python", "manage.py", "migrate", "--noinput"]
    environment: &app_env
      DJANGO_SECRET_KEY: local-only-replace-before-deployment
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,web
      POSTGRES_HOST: db
      POSTGRES_DB: eventrail
      POSTGRES_USER: eventrail
      POSTGRES_PASSWORD: eventrail-local
      KAFKA_BOOTSTRAP_SERVERS: broker:19092
    depends_on:
      db:
        condition: service_healthy

  web:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment: *app_env
    depends_on:
      migrate:
        condition: service_completed_successfully
      topics:
        condition: service_completed_successfully

  publisher:
    build: .
    command: ["python", "manage.py", "run_publisher"]
    environment: *app_env
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      topics:
        condition: service_completed_successfully

  consumer:
    build: .
    command: ["python", "manage.py", "run_consumer"]
    environment: *app_env
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      topics:
        condition: service_completed_successfully

volumes:
  postgres_data:
  kafka_data:
